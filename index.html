<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rádio Estância da Nostalgia</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #222;
      color: black;
      font-style: bold;
    }
    header {
      background: url(../img/bandeirars.gif) center/cover no-repeat;
      padding: 15px;
      display: flex;
      align-items: center;
      position: relative;
      min-height: 230px;
    }
    #capa {
      width: 200px;
      height: 200px;
      border-radius: 8px;
      object-fit: cover;
      margin-right: 15px;
      flex-shrink: 0;
      background: #111;
      transition: opacity 0.4s;
    }
    .info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      min-width: 0;
    }
    #cantor {
      font-size: 20px;
      font-weight: bold;
      margin: 0 0 4px 0;
    }
    #musica {
      font-size: 18px;
      margin: 0 0 8px 0;
    }
    .controles {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .controles i { font-size: 22px; cursor: pointer; color: #fff; }
    input[type="range"] { width: 80px; cursor: pointer; }
    #playPause.stop { color: #000; }
    #playPause.play { color: #0f0; }
    #status {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      margin-top: 6px;
      height: 14px;
    }
    #clock {
      position: absolute;
      bottom: 8px;
      right: 10px;
      font-size: 16px;
      font-weight: bold;
      color: black;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #clock i { font-size: 16px; }
    #nome-radio {
      font-family: 'Impact', sans-serif;
      position: absolute;
      right: 50px;
      top: 50%;
      transform: translateY(-60%);
      color: #ffffff;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 2px;
      text-align: center;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
      pointer-events: none;
    }
    @media (max-width: 1024px) {
      #nome-radio { display: none; }
    }
    a.link-artista {
      color: #0f0;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <img id="capa" src="../img/logo.png" alt="Capa do álbum"
    onerror="this.onerror=null;this.src='../img/logo.png'">

  <div class="info">
    <h2 id="cantor">Rádio Estância da Nostalgia</h2>
    <h3 id="musica"></h3>

    <audio id="player" preload="none"></audio>

    <div class="controles">
      <i id="muteIcon" class="fa-solid fa-volume-high" title="Mudo"></i>
      <input type="range" id="volume" min="0" max="1" step="0.1" value="1" title="Volume">
      <i id="playPause" class="fa-solid fa-play play" title="Play"></i>
    </div>

    <div id="status">⏸ Parado</div>
  </div>

  <!-- Nome da rádio centralizado à direita -->
  <div id="nome-radio">RÁDIO ESTÂNCIA DA NOSTALGIA</div>

  <div id="clock">
    <i class="fa-solid fa-clock"></i>
    <span id="timeText"></span>
  </div>
</header>

<script>
  const STREAM_URL  = "https://everest.servercast.com.br:1290/;?type=http&nocache=";
  const META_URL    = "/api/meta";
  const LASTFM_KEY  = "SUA_CHAVE_LASTFM_AQUI";
  const CAPA_PADRAO = "../img/logo.png";
  const REDES_ARTISTAS = {
    "Adair de Freitas":"https://www.instagram.com/adairdefreitasoficial/",
    "Alemão Preto":       "https://www.instagram.com/alemaopretooficiall/",
    "Baitaca":         "https://www.instagram.com/baitaca_oficial/",
    "César Oliveira E Rogério Melo":"https://www.instagram.com/cesarerogerio/",
    "Chiquito E Bordoneio":   "https://www.instagram.com/chiquitoebordoneio/",
    "Cristiano Quevedo": "https://www.instagram.com/cristianoquevedo/",
    "Daniel Torres":     "https://www.instagram.com/danieltorres.cantor/",
    "Elton Saldanha":     "https://www.instagram.com/eltonsaldanhaes/",
    "Ênio Medeiros":       "https://www.instagram.com/eniomedeirosoficial/",
    "Gaiteiro Da Palmeira":   "https://www.facebook.com/gaiteirodapalmeira",
    "Gaúcho Da Fronteira":"https://www.instagram.com/gauchodafronteira/",
    "Gonzaga Dos Reis":     "https://www.letras.mus.br/gonzaga-dos-reis/discografia/",
    "Grupo Carqueja":      "https://www.instagram.com/grupocarqueja/",
    "Grupo Pialo":         "https://www.facebook.com/rsgrupopialo/",
    "Grupo Rodeio":        "https://www.instagram.com/gruporodeio/",
    "Iedo Silva":         "https://www.facebook.com/CantorIedoSilva?rdid=0NbbOuqwQk0EF9zU&share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F1BTTnM5RCV%2F#",
    "Jairo Lambari Fernandes": "https://www.instagram.com/jairolambarifernandes/",
    "João de Almeida Neto": "https://www.instagram.com/joaodealmeidanetooficial/",
    "João Luiz Corrêa":     "https://www.instagram.com/jlccorrea",
    "Jorge Freitas":        "https://www.facebook.com/jorgefreittas/",
    "José Cláudio Machado": "https://pt.wikipedia.org/wiki/Jos%C3%A9_Cl%C3%A1udio_Machado",
    "Leonel Gomez":        "https://www.instagram.com/leonelgomezoficial/",
    "Luiz Marenco":       "https://www.instagram.com/luiz_marenco/",
    "Mano Lima":          "https://www.instagram.com/manolimaoficial/",
    "Maria Celoy":      "https://www.instagram.com/maria_celoy/",
    "Marlon Maciel":      "https://www.instagram.com/marlonmacieloficial/",
    "Os Farrapos":       "https://www.instagram.com/grupoosfarrapos/",
    "Os Mateadores":     "https://www.instagram.com/osmateadores/",
    "Os Mirins":       "https://www.instagram.com/osmirins/",
    "Os Monarcas":     "https://www.instagram.com/osmonarcasoficial/",
    "Os Serranos":     "https://www.instagram.com/osserranos/",
    "Pedro Ortaça":       "https://www.facebook.com/roseortaca66",
    "Porca Véia":         "https://www.facebook.com/porcaveiaoficial/?ref=PRODASH_UPSELL_xav_ig_profile_page_web#",
    "Renato Borghetti":     "https://www.instagram.com/renatoborghettioficial",
    "Roberto Luçardo":       "https://www.facebook.com/profile.php?id=100063632165350#",
    "Sidnei Lima":        "https://www.letras.mus.br/sidney-lima/discografia/",
    "Tchê Campeiro":        "https://www.instagram.com/tchecampeiro/",
    "Tchê Garotos":       "https://www.instagram.com/tchegarotosoficial/",
    "Teixeirinha":     "https://www.youtube.com/@OficialTeixeirinha",
    "Thiago Reder":        "https://www.instagram.com/thiago_reder/",
    "Valdir Verona":       "https://www.instagram.com/valdirveronaoficial/",
  };

  const audio     = document.getElementById("player");
  const cantorEl  = document.getElementById("cantor");
  const nomeEl    = document.getElementById("musica");
  const capaEl    = document.getElementById("capa");
  const volumeEl  = document.getElementById("volume");
  const playPause = document.getElementById("playPause");
  const muteIcon  = document.getElementById("muteIcon");
  const statusEl  = document.getElementById("status");
  const timeText  = document.getElementById("timeText");

  let playing      = false;
  let metaInterval = null;
  let ultimoTitulo = "";

  /* ══════════════════════════════════════════
     MONTA HTML DO ARTISTA
     Divide por "ft." e linka cada nome
  ══════════════════════════════════════════ */
  function montarHtmlArtista(artistaRaw) {
    if (!artistaRaw) return "Rádio Estância da Nostalgia";

    // Separa pelo "ft." com variações: "ft.", "ft", "Ft.", "FT."
    const partes = artistaRaw.split(/\s+[Ff][Tt]\.?\s+/);

    const htmlPartes = partes.map((nome, idx) => {
      const nomeTrimado = nome.trim();
      const link = REDES_ARTISTAS[nomeTrimado];

      // Se tem link cadastrado, vira âncora clicável
      const html = (link !== undefined && link !== "")
        ? `<a class="link-artista" href="${link}" target="_blank" rel="noopener">${nomeTrimado}</a>`
        : `<span style="color:black;">${nomeTrimado}</span>`;

      // Adiciona separador "ft." entre os nomes
      return idx < partes.length - 1
        ? html + `<span class="ft-sep"> ft. </span>`
        : html;
    });

    return htmlPartes.join("");
  }

  /* ══════════════════════════════════════════
     BUSCA DE CAPA EM CASCATA
     Usa só o artista principal (antes do ft.)
  ══════════════════════════════════════════ */
  function setCapa(url) {
    const img = new Image();
    img.onload  = () => { capaEl.src = url; };
    img.onerror = () => { capaEl.src = CAPA_PADRAO; };
    img.src = url;
  }

  function artistaPrincipal(artista) {
    return artista.split(/\s+[Ff][Tt]\.?\s+/)[0].trim();
  }

  function buscarItunes(artista, titulo) {
    const q = encodeURIComponent(artistaPrincipal(artista) + " " + titulo);
    return fetch("https://itunes.apple.com/search?term=" + q + "&media=music&limit=1&entity=song")
      .then(r => r.json())
      .then(data => {
        if (data.results && data.results.length > 0) {
          const url = data.results[0].artworkUrl100.replace("100x100bb", "600x600bb");
          setCapa(url);
          return true;
        }
        return false;
      })
      .catch(() => false);
  }

  function buscarMusicBrainz(artista, titulo) {
    const principal = artistaPrincipal(artista);
    const q = encodeURIComponent('recording:"' + titulo + '" AND artist:"' + principal + '"');
    return fetch("https://musicbrainz.org/ws/2/recording/?query=" + q + "&limit=1&fmt=json", {
      headers: { "User-Agent": "RadioWebPlayer/1.0 (contato@exemplo.com)" }
    })
      .then(r => r.json())
      .then(data => {
        if (!data.recordings || data.recordings.length === 0) return false;
        const releases = data.recordings[0].releases;
        if (!releases || releases.length === 0) return false;
        const releaseId = releases[0].id;
        const url = "https://coverartarchive.org/release/" + releaseId + "/front-500";
        setCapa(url);
        return true;
      })
      .catch(() => false);
  }

  function buscarLastFm(artista, titulo) {
    if (LASTFM_KEY === "SUA_CHAVE_LASTFM_AQUI") return Promise.resolve(false);
    const principal = artistaPrincipal(artista);
    const url = "https://ws.audioscrobbler.com/2.0/?method=track.getInfo"
      + "&api_key=" + LASTFM_KEY
      + "&artist=" + encodeURIComponent(principal)
      + "&track="  + encodeURIComponent(titulo)
      + "&format=json";
    return fetch(url)
      .then(r => r.json())
      .then(data => {
        const images = data.track && data.track.album && data.track.album.image;
        if (!images) return false;
        const extralarge = images.find(i => i.size === "extralarge");
        const imgUrl = extralarge && extralarge["#text"];
        if (imgUrl && imgUrl.length > 0) {
          setCapa(imgUrl);
          return true;
        }
        return false;
      })
      .catch(() => false);
  }

  async function buscarCapa(artista, titulo) {
    if (!artista && !titulo) return;
    const encontrouItunes = await buscarItunes(artista, titulo);
    if (encontrouItunes) return;
    const encontrouMB = await buscarMusicBrainz(artista, titulo);
    if (encontrouMB) return;
    const encontrouLFM = await buscarLastFm(artista, titulo);
    if (encontrouLFM) return;
    capaEl.src = CAPA_PADRAO;
  }

  /* ══════════════════════════════════════════
     METADADOS VIA PROXY VERCEL
  ══════════════════════════════════════════ */
  function fetchMeta() {
    fetch(META_URL + "?t=" + Date.now(), { cache: "no-store" })
      .then(r => r.json())
      .then(data => {
        const artista = data.artista || "";
        const titulo  = data.titulo  || "";
        const chave   = artista + "||" + titulo;
        if (!titulo) return;

        cantorEl.innerHTML = montarHtmlArtista(artista);
        nomeEl.textContent = titulo;

        if (chave !== ultimoTitulo) {
          ultimoTitulo = chave;
          buscarCapa(artista, titulo);
        }
      })
      .catch(() => {});
  }

  /* ══════════════════════════════════════════
     CONTROLES
  ══════════════════════════════════════════ */
  playPause.addEventListener("click", () => {
    if (!playing) {
      audio.src    = STREAM_URL + Date.now();
      audio.volume = parseFloat(volumeEl.value);
      audio.muted  = false;
      audio.play()
        .then(() => {
          playing = true;
          playPause.className  = "fa-solid fa-stop stop";
          statusEl.textContent = "▶ Ao vivo";
        })
        .catch(() => {
          statusEl.textContent = "❌ Erro ao conectar";
        });
    } else {
      audio.pause();
      audio.src            = "";
      playing              = false;
      playPause.className  = "fa-solid fa-play play";
      statusEl.textContent = "⏸ Parado";
    }
  });

  volumeEl.addEventListener("input", () => {
    const v      = parseFloat(volumeEl.value);
    audio.volume = v;
    audio.muted  = (v === 0);
    muteIcon.className = audio.muted
      ? "fa-solid fa-volume-xmark"
      : "fa-solid fa-volume-high";
  });

  muteIcon.addEventListener("click", () => {
    audio.muted        = !audio.muted;
    muteIcon.className = audio.muted
      ? "fa-solid fa-volume-xmark"
      : "fa-solid fa-volume-high";
  });

  audio.addEventListener("error", () => {
    if (playing) {
      statusEl.textContent = "🔄 Reconectando...";
      setTimeout(() => {
        audio.src = STREAM_URL + Date.now();
        audio.play().catch(() => {});
      }, 3000);
    }
  });

  /* ══════════════════════════════════════════
     RELÓGIO
  ══════════════════════════════════════════ */
  function updateClock() {
    const now = new Date();
    timeText.textContent =
      String(now.getHours()).padStart(2, "0") + ":" +
      String(now.getMinutes()).padStart(2, "0");
  }
  setInterval(updateClock, 1000);
  updateClock();

  fetchMeta();
  metaInterval = setInterval(fetchMeta, 10000);
</script>

</body>
</html>

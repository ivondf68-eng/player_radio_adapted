<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rádio Estância da Nostalgia</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #222;
      color: black;
      font-style: bold;
    }
    header {
      background: url(img/bandeirars.gif) center/cover no-repeat;
      padding: 10px;
      display: flex;
      align-items: center;
      position: relative;
      min-height: 230px;
    }
    #capa {
      width: 200px;
      height: 200px;
      border-radius: 8px;
      object-fit: cover;
      margin-right: 15px;
      flex-shrink: 0;
      background: #111;
      transition: opacity 0.4s;
    }
    .info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      min-width: 0;
    }
    #cantor {
      font-size: 20px;
      font-weight: bold;
      margin: 0 0 4px 0;
    }
    #musica {
      font-size: 18px;
      margin: 0 0 8px 0;
    }
    .controles {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .controles i { font-size: 22px; cursor: pointer; color: #fff; }
    input[type="range"] { width: 80px; cursor: pointer; }
    #playPause.stop { color: #000; }
    #playPause.play { color: #0f0; }
    #status {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      margin-top: 6px;
      height: 14px;
    }
    #clock {
      position: absolute;
      bottom: 8px;
      right: 10px;
      font-size: 16px;
      font-weight: bold;
      color: black;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #clock i { font-size: 16px; }
    #dateText {
      font-size: 15px;
      font-weight: normal;
      color: black;
      margin-left: 4px;
    }
    @media (max-width: 600px) {
      #clock {
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
      }
      #dateText {
        margin-left: 0;
      }
    }
    a.link-artista {
      color: #0f0;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <img id="capa" src="img/logo.png" alt="Capa do álbum"
    onerror="this.onerror=null;this.src='img/logo.png'">

  <div class="info">
    <h2 id="cantor">Rádio Estância da Nostalgia</h2>
    <h3 id="musica"></h3>

    <audio id="player" preload="none"></audio>

    <div class="controles">
      <i id="muteIcon" class="fa-solid fa-volume-high" title="Mudo"></i>
      <input type="range" id="volume" min="0" max="1" step="0.1" value="1" title="Volume">
      <i id="playPause" class="fa-solid fa-stop stop" title="Pause"></i>
    </div>

    <div id="status">🔄 Conectando...</div>
  </div>

  <div id="clock">
    <i class="fa-solid fa-clock"></i>
    <span id="timeText"></span>
    <span id="dateText"></span>
  </div>
</header>

    "Roberto Luçardo":       "https://www.facebook.com/profile.php?id=100063632165350#",
    "Sidnei Lima":        "https://www.letras.mus.br/sidney-lima/discografia/",
    "Shana Müller":       "https://www.instagram.com/shanamullergaucha/",
    "Tchê Barbaridade":       "https://www.instagram.com/tchebarbaridade/",
    "Tchê Campeiro":        "https://www.instagram.com/tchecampeiro/",
    "Tchê Garotos":       "https://www.instagram.com/tchegarotosoficial/",
    "Teixeirinha":     "https://www.youtube.com/@OficialTeixeirinha",
    "Telmo de Lima Freitas":       "https://www.letras.mus.br/telmo-de-lima-freitas/discografia/",
    "Thiago Reder":        "https://www.instagram.com/thiago_reder/",
    "Tibúrcio da Estância":       "https://www.instagram.com/tiburcio_da_estancia/",
    "Tio Nanato":       "https://www.letras.mus.br/tio-nanato/discografia/",
    "Tio Rone":       "https://www.youtube.com/channel/UCuZCBr5RX7yE03p_zxlyFPA",
    "Valdir Verona":       "https://www.instagram.com/valdirveronaoficial/",
    "Walther Morais":       "https://www.instagram.com/cantorwalthermorais/",
    "Wilson Paim":         "https://www.instagram.com/wilsonpaim/",
    "Xirú Missioneiro":       "https://www.instagram.com/xiru_missioneiro/",
    "Zezinho e Julieta":       "https://www.letras.mus.br/zezinho-julieta/discografia/",
  };

  const audio     = document.getElementById("player");
  const cantorEl  = document.getElementById("cantor");
  const nomeEl    = document.getElementById("musica");
  const capaEl    = document.getElementById("capa");
  const volumeEl  = document.getElementById("volume");
  const playPause = document.getElementById("playPause");
  const muteIcon  = document.getElementById("muteIcon");
  const statusEl  = document.getElementById("status");
  const timeText  = document.getElementById("timeText");

  let playing      = true;
  let metaInterval = null;
  let ultimoTitulo = "";

  /* ══════════════════════════════════════════
     SANITIZAÇÃO — evita XSS via dados do stream
  ══════════════════════════════════════════ */
  function sanitize(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML; // escapa <, >, &, ", '
  }

  /* ══════════════════════════════════════════
     MONTA HTML DO ARTISTA
     Usa sanitize() em cada nome antes de injetar
  ══════════════════════════════════════════ */
  function montarHtmlArtista(artistaRaw) {
    if (!artistaRaw) return "Rádio Estância da Nostalgia";

    const partes = artistaRaw.split(/\s+E\s+/);

    const htmlPartes = partes.map((nome, idx) => {
      const nomeTrimado = nome.trim();
      const nomeSanitizado = sanitize(nomeTrimado); // ← sanitização aqui
      const link = REDES_ARTISTAS[nomeTrimado];

      const html = (link !== undefined && link !== "")
        ? `<a class="link-artista" href="${sanitize(link)}" target="_blank" rel="noopener noreferrer">${nomeSanitizado}</a>`
        : `<span style="color:black;">${nomeSanitizado}</span>`;

      return idx < partes.length - 1
        ? html + `<span class="ft-sep"> E </span>`
        : html;
    });

    return htmlPartes.join("");
  }

  /* ══════════════════════════════════════════
     CAPA — cascata iTunes → MusicBrainz
     Last.fm agora é buscado no servidor (api/meta.js)
  ══════════════════════════════════════════ */
  function setCapa(url) {
    const img = new Image();
    img.onload  = () => { capaEl.src = url; };
    img.onerror = () => { capaEl.src = CAPA_PADRAO; };
    img.src = url;
  }

  function artistaPrincipal(artista) {
    return artista.split(/\s+[Ff][Tt]\.?\s+/)[0].trim();
  }

  function buscarItunes(artista, titulo) {
    const q = encodeURIComponent(artistaPrincipal(artista) + " " + titulo);
    return fetch("https://itunes.apple.com/search?term=" + q + "&media=music&limit=1&entity=song")
      .then(r => r.json())
      .then(data => {
        if (data.results && data.results.length > 0) {
          const url = data.results[0].artworkUrl100.replace("100x100bb", "600x600bb");
          setCapa(url);
          return true;
        }
        return false;
      })
      .catch(() => false);
  }

  function buscarMusicBrainz(artista, titulo) {
    const principal = artistaPrincipal(artista);
    const q = encodeURIComponent('recording:"' + titulo + '" AND artist:"' + principal + '"');
    return fetch("https://musicbrainz.org/ws/2/recording/?query=" + q + "&limit=1&fmt=json", {
      headers: { "User-Agent": "RadioWebPlayer/1.0 (contato@exemplo.com)" }
    })
      .then(r => r.json())
      .then(data => {
        if (!data.recordings || data.recordings.length === 0) return false;
        const releases = data.recordings[0].releases;
        if (!releases || releases.length === 0) return false;
        const releaseId = releases[0].id;
        const url = "https://coverartarchive.org/release/" + releaseId + "/front-500";
        setCapa(url);
        return true;
      })
      .catch(() => false);
  }

  async function buscarCapa(artista, titulo, capaUrlServidor) {
    if (!artista && !titulo) return;

    // 1) Capa já resolvida pelo servidor via Last.fm (chave fica no backend)
    if (capaUrlServidor) {
      setCapa(capaUrlServidor);
      return;
    }
    // 2) iTunes
    const encontrouItunes = await buscarItunes(artista, titulo);
    if (encontrouItunes) return;
    // 3) MusicBrainz
    const encontrouMB = await buscarMusicBrainz(artista, titulo);
    if (encontrouMB) return;

    capaEl.src = CAPA_PADRAO;
  }

  /* ══════════════════════════════════════════
     METADADOS VIA PROXY VERCEL
  ══════════════════════════════════════════ */
  function fetchMeta() {
    fetch(META_URL + "?t=" + Date.now(), { cache: "no-store" })
      .then(r => r.json())
      .then(data => {
        const artista   = data.artista  || "";
        const titulo    = data.titulo   || "";
        const capaUrl   = data.capaUrl  || "";
        const chave     = artista + "||" + titulo;
        if (!titulo) return;

        cantorEl.innerHTML = montarHtmlArtista(artista);
        nomeEl.textContent = titulo;

        if (chave !== ultimoTitulo) {
          ultimoTitulo = chave;
          buscarCapa(artista, titulo, capaUrl);
        }
      })
      .catch(() => {});
  }

  /* ══════════════════════════════════════════
     CONTROLES
  ══════════════════════════════════════════ */
  playPause.addEventListener("click", () => {
    if (!playing) {
      audio.src    = STREAM_URL + Date.now();
      audio.volume = parseFloat(volumeEl.value);
      audio.muted  = false;
      audio.play()
        .then(() => {
          playing = true;
          playPause.className  = "fa-solid fa-stop stop";
          statusEl.textContent = "▶ Ao vivo";
        })
        .catch(() => {
          statusEl.textContent = "❌ Erro ao conectar";
        });
    } else {
      audio.pause();
      audio.src            = "";
      playing              = false;
      playPause.className  = "fa-solid fa-play play";
      statusEl.textContent = "⏸ Parado";
    }
  });

  volumeEl.addEventListener("input", () => {
    const v      = parseFloat(volumeEl.value);
    audio.volume = v;
    audio.muted  = (v === 0);
    muteIcon.className = audio.muted
      ? "fa-solid fa-volume-xmark"
      : "fa-solid fa-volume-high";
  });

  muteIcon.addEventListener("click", () => {
    audio.muted        = !audio.muted;
    muteIcon.className = audio.muted
      ? "fa-solid fa-volume-xmark"
      : "fa-solid fa-volume-high";
  });

  audio.addEventListener("error", () => {
    if (playing) {
      statusEl.textContent = "🔄 Reconectando...";
      setTimeout(() => {
        audio.src = STREAM_URL + Date.now();
        audio.play().catch(() => {});
      }, 3000);
    }
  });

  /* ══════════════════════════════════════════
     RELÓGIO
  ══════════════════════════════════════════ */
  function updateClock() {
    const now = new Date();
    timeText.textContent =
      String(now.getHours()).padStart(2, "0") + ":" +
      String(now.getMinutes()).padStart(2, "0");

    const dias = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
    document.getElementById("dateText").textContent =
      dias[now.getDay()] + ", " +
      String(now.getDate()).padStart(2, "0") + "/" +
      String(now.getMonth() + 1).padStart(2, "0") + "/" +
      now.getFullYear();
  }
  setInterval(updateClock, 1000);
  updateClock();

  fetchMeta();
  metaInterval = setInterval(fetchMeta, 10000);

  audio.src    = STREAM_URL + Date.now();
  audio.volume = parseFloat(volumeEl.value);
  audio.play()
    .then(() => {
      playPause.className  = "fa-solid fa-stop stop";
      statusEl.textContent = "▶ Ao vivo";
    })
    .catch(() => {
      playing              = false;
      playPause.className  = "fa-solid fa-play play";
      statusEl.textContent = "▶ Clique para ouvir";
      audio.src            = "";
    });
</script>
